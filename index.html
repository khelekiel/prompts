<!DOCTYPE html>
<html>
<head>
    <title>Prompt Selector</title>
    <link rel="stylesheet" href="style.css"/>
    <script src="script.js" defer></script>
</head>
<body>
    <h2>Click the button to choose a prompt</h2>

    <div style="display:flex; gap:20px">

        <div style="width:30%">
        <button onclick="pick_prompt1()">Prompts for Standalone Presentations</button>
        
        <p id="prompt_set1" style="width:30%; height:30%;background-color:#F5F3F2">            
        </p>
        </div>
        
        <div style="width:30%">
        <button onclick="pick_prompt2()">Prompts for Speech Presentations</button>
        <p id="prompt_set2"style="width:30%; height:30%;background-color:#F5F3F2">            
        </p>
        </div>        

        </div>
    
<div class="explain">
Click until you get a prompt you like; you can adjust any of these to a subject you know.
</div>
</body>
</html>
